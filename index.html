<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hegazy">
<title>Hegazy — Patient Ledger</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<style>
  :root{
    --ink:#16221F;
    --muted:#5D6E6A;
    --bg:#EAF0EE;
    --surface:#FFFFFF;
    --line:#D3DEDA;
    --primary:#2F6F68;
    --primary-dark:#1F4E49;
    --clay:#A85A34;
    --clay-soft:#F4E3D8;
    --mint-soft:#DCEAE6;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  @font-face{
    font-family:'Fraunces';
    src:local('Fraunces');
  }
  h1,h2,h3,.display{
    font-family:'Fraunces','IBM Plex Sans',serif;
    letter-spacing:-0.01em;
  }
  .mono, .amount, input[type=number], .field-date{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-variant-numeric:tabular-nums;
  }

  header.top{
    padding:20px 20px 14px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:10;
  }
  header.top h1{ margin:0; font-size:22px; color:var(--primary-dark); }
  header.top .sub{ margin-top:2px; font-size:13px; color:var(--muted); }

  main{ padding:16px; padding-bottom:100px; max-width:640px; margin:0 auto; }

  .tabpane{ display:none; }
  .tabpane.active{ display:block; }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }

  button{
    font:inherit; border:none; border-radius:10px; cursor:pointer;
    padding:12px 16px; font-weight:600; font-size:15px;
  }
  .btn-primary{ background:var(--primary); color:#fff; width:100%; }
  .btn-primary:active{ background:var(--primary-dark); }
  .btn-secondary{ background:var(--mint-soft); color:var(--primary-dark); width:100%; }
  .btn-ghost{ background:transparent; color:var(--primary-dark); padding:8px 10px; }
  .btn-danger{ background:transparent; color:var(--clay); padding:8px 10px; }
  .btn-row{ display:flex; gap:10px; margin-top:12px; }
  .btn-row > *{ flex:1; }

  input, select, textarea{
    width:100%; padding:11px 12px; border:1px solid var(--line);
    border-radius:10px; font-size:15px; background:#fff; color:var(--ink);
  }
  label{ display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }

  .empty{ text-align:center; padding:40px 20px; color:var(--muted); }
  .empty .glyph{ font-size:32px; margin-bottom:8px; }

  .rec{
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:14px 4px; border-bottom:1px solid var(--line); gap:10px;
  }
  .rec:last-child{ border-bottom:none; }
  .rec .name{ font-weight:600; font-size:15.5px; }
  .rec .meta{ font-size:12.5px; color:var(--muted); margin-top:3px; }
  .rec .amt{ font-weight:600; white-space:nowrap; }
  .rec .amt.neg{ color:var(--clay); }

  .toolbar{ display:flex; gap:8px; margin-bottom:12px; }
  .toolbar input{ flex:1; }
  .toolbar select{ width:auto; }

  .month-block{ margin-bottom:16px; }
  .month-title{ font-size:16px; font-weight:600; margin-bottom:8px; }
  .line-row{ display:flex; justify-content:space-between; padding:6px 0; font-size:14.5px; }
  .line-row.total{ border-top:1px solid var(--line); margin-top:4px; padding-top:8px; font-weight:700; }
  .bar-track{ height:8px; background:var(--mint-soft); border-radius:5px; overflow:hidden; margin:8px 0 4px; }
  .bar-fill{ height:100%; background:var(--primary); }

  .ph-month{
  display:flex;
  justify-content:space-between;
  align-items:center;

  background:var(--primary-dark);
  color:#fff;

  padding:13px 14px;
  margin:22px 0 10px;

  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.12);
}

.ph-month .label{
  font-family:'Fraunces','IBM Plex Sans',serif;
  font-size:20px;
  font-weight:800;
  color:#fff;
}

.ph-month .total{
  font-size:15px;
  font-weight:800;
  color:#fff;
}
  .ph-day{ display:flex; justify-content:space-between; align-items:baseline;
    padding:8px 4px; background:var(--mint-soft); border-radius:8px; margin-top:8px; font-size:13px; }
  .ph-day .label{ font-weight:600; color:var(--primary-dark); }
  .ph-day .total{ font-weight:600; color:var(--muted); }
  .ph-branch-header{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:10px 12px; margin-top:14px;
    background:var(--mint-soft); color:var(--primary-dark);
    border-radius:9px; font-size:14px;
    border-left:4px solid var(--primary);
  }
  .ph-branch-header .label{ font-weight:800; letter-spacing:0.02em; }
  .ph-branch-header .total{ font-weight:700; }

  nav.tabs{
    position:fixed; bottom:0; left:0; right:0;
    background:var(--surface); border-top:1px solid var(--line);
    display:flex; padding-bottom:env(safe-area-inset-bottom);
    z-index:20;
  }
  nav.tabs button{
    flex:1; background:none; border-radius:0; padding:10px 4px 8px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--muted); font-size:11px; font-weight:600;
  }
  nav.tabs button.active{ color:var(--primary-dark); }
  nav.tabs .icon{ font-size:19px; }

  .modal-backdrop{
    display:none; position:fixed; inset:0; background:rgba(22,34,31,0.45);
    z-index:30; align-items:flex-end;
  }
  .modal-backdrop.show{ display:flex; }
  .modal{
    background:#fff; width:100%; max-height:90vh; overflow-y:auto;
    border-radius:20px 20px 0 0; padding:20px; padding-bottom:calc(20px + env(safe-area-inset-bottom));
  }
  .modal h2{ margin:0 0 4px; font-size:19px; }
  .modal .close{ float:right; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .progress-wrap{ margin-top:14px; }
  .progress-track{ height:8px; background:var(--mint-soft); border-radius:5px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--primary); width:0%; transition:width .2s; }
  .progress-label{ font-size:13px; color:var(--muted); margin-top:6px; }

  .preview-row{ border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
  .preview-row .grid2{ margin-top:8px; }
  .preview-row .rowhead{ display:flex; justify-content:space-between; align-items:center; }
  .preview-row .rowhead .idx{ font-size:12px; color:var(--muted); }
</style>
</head>
<body>

<header class="top">
  <h1 id="pageTitle">Hegazy</h1>
  <div class="sub" id="pageSub">Patient ledger</div>
</header>

<main>

  <!-- IMPORT -->
  <section class="tabpane active" id="tab-import">
    <div class="card">
      <div class="empty" style="padding:8px 0 4px;">
        <div class="glyph">🧾</div>
        <div>Scan a printed Payments Report, or upload an existing image.</div>
      </div>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
      <input type="file" id="libraryInput" accept="image/*" style="display:none">
      <div class="btn-row" style="margin-top:0;">
        <button class="btn-primary" onclick="document.getElementById('cameraInput').click()">Take Photo</button>
        <button class="btn-secondary" onclick="document.getElementById('libraryInput').click()">Choose from Library</button>
      </div>
      <button class="btn-ghost" style="width:100%; margin-top:10px;" onclick="openManualEntryModal()">+ Add Manually Instead</button>
      <div class="progress-wrap" id="progressWrap" style="display:none;">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-label" id="progressLabel">Reading text…</div>
      </div>
    </div>

    <div id="previewSection" style="display:none;">
      <h3 style="margin:4px 0 10px;">Review before saving</h3>
      <div id="previewList"></div>
      <div class="btn-row">
        <button class="btn-secondary" onclick="cancelPreview()">Discard</button>
        <button class="btn-primary" onclick="commitPreview()">Save All</button>
      </div>
    </div>
  </section>

  <!-- PATIENTS -->
  <section class="tabpane" id="tab-patients">
    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="Search patient, phone, doctor" oninput="renderPatients()">
    </div>
    <div class="toolbar">
      <select id="branchFilter" onchange="renderPatients()" style="flex:1;"></select>
      <select id="sortSelect" onchange="renderPatients()">
        <option value="nameAZ">Name A–Z</option>
        <option value="amountDesc">Amount ↓</option>
      </select>
    </div>
    <div class="card" id="patientListCard"></div>
  </section>

  <!-- SUMMARY -->
  <section class="tabpane" id="tab-summary">
    <div id="summaryContent"></div>
  </section>

  <!-- EXPENSES -->
  <section class="tabpane" id="tab-expenses">
    <button class="btn-primary" style="margin-bottom:14px;" onclick="openExpenseModal()">+ Add Expense</button>
    <div class="card" id="expenseListCard"></div>
  </section>

  <div class="card" style="margin-top:6px;">
    <div style="font-size:13px;color:var(--muted);margin-bottom:8px;">
      Data is stored on this device only. Back it up regularly.
    </div>
    <div class="btn-row">
      <button class="btn-ghost" onclick="exportBackup()">Export Backup (JSON)</button>
      <button class="btn-ghost" onclick="document.getElementById('importBackupInput').click()">Import Backup</button>
    </div>
    <input type="file" id="importBackupInput" accept="application/json" style="display:none">
  </div>

</main>

<nav class="tabs">
  <button class="active" data-tab="import" onclick="showTab('import')">
    <span class="icon">🧾</span><span>Import</span>
  </button>
  <button data-tab="patients" onclick="showTab('patients')">
    <span class="icon">👤</span><span>Patients</span>
  </button>
  <button data-tab="summary" onclick="showTab('summary')">
    <span class="icon">📊</span><span>Summary</span>
  </button>
  <button data-tab="expenses" onclick="showTab('expenses')">
    <span class="icon">➖</span><span>Expenses</span>
  </button>
</nav>

<!-- Record edit modal -->
<div class="modal-backdrop" id="recordModalBackdrop">
  <div class="modal">
    <h2>Edit Visit</h2>
    <label>Patient name</label><input id="f_patientName">
    <div class="grid2">
      <div><label>Phone</label><input id="f_phone"></div>
      <div><label>Date</label><input id="f_date" type="datetime-local" class="field-date"></div>
    </div>
    <div class="grid2">
      <div><label>Doctor</label><input id="f_doctorName"></div>
      <div><label>Branch</label><input id="f_branch"></div>
    </div>
    <div class="grid2">
      <div><label>Category</label><input id="f_category"></div>
      <div><label>Service</label><input id="f_service"></div>
    </div>
    <div class="grid2">
      <div><label>Payment (LE)</label><input id="f_payment" type="number" step="0.01"></div>
      <div><label>Refund (LE)</label><input id="f_refund" type="number" step="0.01"></div>
    </div>
    <div class="btn-row">
      <button class="btn-danger" onclick="deleteCurrentRecord()">Delete</button>
      <button class="btn-secondary" onclick="closeRecordModal()">Cancel</button>
      <button class="btn-primary" onclick="saveRecordModal()">Save</button>
    </div>
  </div>
</div>

<!-- Manual entry modal -->
<div class="modal-backdrop" id="manualModalBackdrop">
  <div class="modal">
    <h2>Add Visit Manually</h2>
    <label>Patient name</label><input id="m_patientName">
    <div class="grid2">
      <div><label>Phone</label><input id="m_phone"></div>
      <div><label>Date</label><input id="m_date" type="datetime-local" class="field-date"></div>
    </div>
    <div class="grid2">
      <div><label>Doctor</label><input id="m_doctorName"></div>
      <div><label>Branch</label><select id="m_branch">
          <option value="">Select branch</option>
          <option value="B1">B1</option>
          <option value="B10">B10</option>
          <option value="B12">B12</option>
        </select></div>
    </div>
    <div class="grid2">
      <div><label>Category</label><input id="m_category"></div>
      <div><label>Service</label><input id="m_service"></div>
    </div>
    <div class="grid2">
      <div><label>Payment (LE)</label><input id="m_payment" type="number" step="0.01"></div>
      <div><label>Refund (LE)</label><input id="m_refund" type="number" step="0.01"></div>
    </div>
    <div class="btn-row">
      <button class="btn-secondary" onclick="closeManualEntryModal()">Cancel</button>
      <button class="btn-primary" onclick="saveManualEntry()">Save</button>
    </div>
  </div>
</div>

<!-- Expense modal -->
<div class="modal-backdrop" id="expenseModalBackdrop">
  <div class="modal">
    <h2>Add Expense</h2>
    <label>Title</label><input id="e_title" placeholder="e.g. Dental supplies">
    <label>Category</label>
    <select id="e_category">
      <option>General</option><option>Supplies</option><option>Rent</option>
      <option>Salaries</option><option>Lab Fees</option><option>Utilities</option><option>Other</option>
    </select>
    <div class="grid2">
      <div><label>Amount (LE)</label><input id="e_amount" type="number" step="0.01"></div>
      <div><label>Date</label><input id="e_date" type="date"></div>
    </div>
    <label>Notes</label><input id="e_notes">
    <div class="btn-row">
      <button class="btn-secondary" onclick="closeExpenseModal()">Cancel</button>
      <button class="btn-primary" onclick="saveExpenseModal()">Save</button>
    </div>
  </div>
</div>

<script>
/* ---------- Storage ---------- */
const STORE_RECORDS = 'sanad_records';
const STORE_EXPENSES = 'sanad_expenses';

function loadRecords(){ return JSON.parse(localStorage.getItem(STORE_RECORDS) || '[]'); }
function saveRecords(r){ localStorage.setItem(STORE_RECORDS, JSON.stringify(r)); }
function loadExpenses(){ return JSON.parse(localStorage.getItem(STORE_EXPENSES) || '[]'); }
function saveExpenses(e){ localStorage.setItem(STORE_EXPENSES, JSON.stringify(e)); }

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ---------- Tabs ---------- */
const titles = {
  import: ['Hegazy','Scan a report'],
  patients: ['Patients','Every visit, searchable'],
  summary: ['Summary','Grouped by month'],
  expenses: ['Expenses','Clinic costs']
};
function showTab(name){
  document.querySelectorAll('.tabpane').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  document.getElementById('pageTitle').textContent = titles[name][0];
  document.getElementById('pageSub').textContent = titles[name][1];
  if(name==='patients') renderPatients();
  if(name==='summary') renderSummary();
  if(name==='expenses') renderExpenses();
}

/* ---------- OCR + Parsing ---------- */
const COLUMNS = [
  {key:'phone',     min:0.00, max:0.14},
  {key:'date',      min:0.14, max:0.24},
  {key:'branch',    min:0.24, max:0.32},
  {key:'createdBy', min:0.32, max:0.40},
  {key:'patient',   min:0.40, max:0.58},
  {key:'doctor',    min:0.58, max:0.68},
  {key:'category',  min:0.68, max:0.74},
  {key:'service',   min:0.74, max:0.80},
  {key:'type',      min:0.80, max:0.85},
  {key:'payment',   min:0.85, max:0.93},
  {key:'refund',    min:0.93, max:1.00},
];

function columnFor(midXFrac){
  return COLUMNS.find(c => midXFrac >= c.min && midXFrac < c.max);
}

function parseReport(lines, imageWidth){
  const buckets = {};
  COLUMNS.forEach(c => buckets[c.key] = []);

  lines.forEach(line => {
    const midX = ((line.bbox.x0 + line.bbox.x1) / 2) / imageWidth;
    const col = columnFor(midX);
    if(!col) return;
    const midY = (line.bbox.y0 + line.bbox.y1) / 2;
    buckets[col.key].push({ text: line.text.trim(), midY });
  });

  const anchors = buckets['patient'].slice().sort((a,b)=>a.midY-b.midY);
  if(anchors.length === 0) return [];

  const rows = anchors.map(()=> ({}));
  COLUMNS.forEach(col => {
    buckets[col.key].forEach(item => {
      let nearest = 0, best = Infinity;
      anchors.forEach((a,i)=>{
        const d = Math.abs(a.midY - item.midY);
        if(d < best){ best = d; nearest = i; }
      });
      if(!rows[nearest][col.key]) rows[nearest][col.key] = [];
      rows[nearest][col.key].push(item);
    });
  });

  return rows.map(row => {
    const join = key => (row[key]||[]).sort((a,b)=>a.midY-b.midY).map(w=>w.text).join(' ').trim();
    const phoneRaw = join('phone');
    if(!/\d/.test(phoneRaw)) return null; // drops the totals row
    return {
      id: uid(),
      phone: phoneRaw.replace('#',''),
      date: parseDateString(join('date')),
      branch: join('branch'),
      createdBy: join('createdBy'),
      patientName: join('patient'),
      doctorName: join('doctor'),
      category: join('category'),
      service: join('service'),
      type: join('type') || 'Cash',
      payment: parseAmount(join('payment')),
      refund: parseAmount(join('refund')),
    };
  }).filter(Boolean);
}

function parseAmount(text){
  const digits = (text.match(/[\d.]/g) || []).join('');
  return parseFloat(digits) || 0;
}

function parseDateString(text){
  // Expected join e.g. "Sept. 7, 2026, 9:11 p.m."
  const cleaned = text.replace(/p\.?m\.?/i,'PM').replace(/a\.?m\.?/i,'AM');
  const d = new Date(cleaned.replace(/(\d{1,2}):(\d{2})/, ' $1:$2'));
  if(!isNaN(d.getTime())) return d.toISOString();
  return new Date().toISOString();
}

let pendingPreview = [];

async function handleFileSelected(e){
  const file = e.target.files[0];
  if(!file) return;
  e.target.value = '';

  const img = new Image();
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    img.src = ev.target.result;
    await img.decode();

    document.getElementById('progressWrap').style.display = 'block';
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('progressLabel').textContent = 'Loading OCR engine…';

    const result = await Tesseract.recognize(img.src, 'ara+eng', {
      logger: m => {
        if(m.status === 'recognizing text'){
          const pct = Math.round(m.progress*100);
          document.getElementById('progressFill').style.width = pct+'%';
          document.getElementById('progressLabel').textContent = 'Reading text… '+pct+'%';
        } else {
          document.getElementById('progressLabel').textContent = m.status;
        }
      }
    });

    document.getElementById('progressWrap').style.display = 'none';

    const lines = result.data.lines || [];
    const parsed = parseReport(lines, img.naturalWidth);

    if(parsed.length === 0){
      showDebugDump(lines, img.naturalWidth);
      return;
    }
    pendingPreview = parsed;
    renderPreview();
  };
  reader.readAsDataURL(file);
}
document.getElementById('cameraInput').addEventListener('change', handleFileSelected);
document.getElementById('libraryInput').addEventListener('change', handleFileSelected);

function renderPreview(){
  const wrap = document.getElementById('previewSection');
  const list = document.getElementById('previewList');
  wrap.style.display = 'block';
  list.innerHTML = pendingPreview.map((r,i)=>`
    <div class="preview-row">
      <div class="rowhead"><span class="idx">Row ${i+1}</span></div>
      <label>Patient name</label>
      <input value="${escapeAttr(r.patientName)}" oninput="pendingPreview[${i}].patientName=this.value">
      <div class="grid2">
        <div><label>Doctor</label><input value="${escapeAttr(r.doctorName)}" oninput="pendingPreview[${i}].doctorName=this.value"></div>
        <div><label>Service</label><input value="${escapeAttr(r.service)}" oninput="pendingPreview[${i}].service=this.value"></div>
      </div>
      <div class="grid2">
        <div><label>Payment</label><input type="number" step="0.01" value="${r.payment}" oninput="pendingPreview[${i}].payment=parseFloat(this.value)||0"></div>
        <div><label>Refund</label><input type="number" step="0.01" value="${r.refund}" oninput="pendingPreview[${i}].refund=parseFloat(this.value)||0"></div>
      </div>
    </div>
  `).join('');
}

function cancelPreview(){
  pendingPreview = [];
  document.getElementById('previewSection').style.display = 'none';
  document.querySelector('#previewSection h3').textContent = 'Review before saving';
  const btnRow = document.querySelector('#previewSection .btn-row');
  if(btnRow) btnRow.style.display = 'flex';
}

function commitPreview(){
  const records = loadRecords();
  pendingPreview.forEach(r => records.push(r));
  saveRecords(records);
  pendingPreview = [];
  document.getElementById('previewSection').style.display = 'none';
  alert('Saved.');
  showTab('patients');
}

function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }

function showDebugDump(lines, imageWidth){
  const wrap = document.getElementById('previewSection');
  const list = document.getElementById('previewList');
  wrap.style.display = 'block';
  document.querySelector('#previewSection h3').textContent = 'No rows matched — diagnostic info';

  if(lines.length === 0){
    list.innerHTML = `<div class="card">Tesseract found no text lines at all in this image. Try a clearer, flatter, better-lit photo.</div>`;
    return;
  }

  const rows = lines
    .map(l => ({ text: l.text.trim(), midXfrac: ((l.bbox.x0+l.bbox.x1)/2/imageWidth), midY: (l.bbox.y0+l.bbox.y1)/2 }))
    .sort((a,b)=> a.midY-b.midY);

  list.innerHTML = `
    <div class="card">
      <div style="font-size:13px;color:var(--muted);margin-bottom:10px;">
        Text was recognized, but no line fell in the expected "Patient" column (40%–58% across).
        Screenshot this list and send it back — the x% column tells us where columns actually
        need to be redrawn for your photos.
      </div>
      <div class="mono" style="font-size:12px; white-space:pre-wrap; line-height:1.6;">
${rows.map(r => `${(r.midXfrac*100).toFixed(0)}%  ${r.text}`).join('\n')}
      </div>
      <button class="btn-secondary" style="margin-top:12px;" onclick="cancelPreview()">Close</button>
    </div>
  `;
  document.getElementById('previewSection').style.display = 'block';
  const btnRow = document.querySelector('#previewSection .btn-row');
  if(btnRow) btnRow.style.display = 'none';
}

/* ---------- Patients ---------- */
let currentEditId = null;

const BRANCHES = ['B1','B10','B12'];

function normalizeBranch(value){
  const compact = (value || '').toUpperCase().replace(/\s+/g,'');
  return BRANCHES.includes(compact) ? compact : (compact || 'Unknown');
}

function branchSort(a,b){
  const ai = BRANCHES.indexOf(a);
  const bi = BRANCHES.indexOf(b);
  if(ai !== -1 && bi !== -1) return ai - bi;
  if(ai !== -1) return -1;
  if(bi !== -1) return 1;
  return a.localeCompare(b);
}

function populateBranchFilter(){
  const sel = document.getElementById('branchFilter');
  const current = sel.value || 'all';

  sel.innerHTML = `<option value="all">All Branches</option>` +
    BRANCHES.map(b => `<option value="${b}">${b}</option>`).join('');

  sel.value = (current === 'all' || BRANCHES.includes(current)) ? current : 'all';
}

function renderPatients(){
  populateBranchFilter();

  const q = (document.getElementById('searchInput').value || '').toLowerCase();
  const sortBy = document.getElementById('sortSelect').value;
  const branchFilter = document.getElementById('branchFilter').value;

  let records = loadRecords();

  // Normalize branch names, so "b 1", "B1", "b10", etc. all group correctly.
  records = records.map(r => ({ ...r, _branch: normalizeBranch(r.branch) }));

  if(branchFilter !== 'all'){
    records = records.filter(r => r._branch === branchFilter);
  }

  if(q){
    records = records.filter(r =>
      (r.patientName || '').toLowerCase().includes(q) ||
      (r.phone || '').includes(q) ||
      (r.doctorName || '').toLowerCase().includes(q)
    );
  }

  const card = document.getElementById('patientListCard');

  if(records.length === 0){
    card.innerHTML = `<div class="empty"><div class="glyph">👤</div><div>No patients yet. Import a report to get started.</div></div>`;
    return;
  }

  const pad = n => String(n).padStart(2,'0');

  // Always group: Month -> Branch -> Day -> Records.
  // When one branch is selected, we simply hide the branch heading.
  const months = {};

  records.forEach(r => {
    const d = new Date(r.date);
    const mKey = `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
    const dKey = `${mKey}-${pad(d.getDate())}`;
    const branch = r._branch;

    if(!months[mKey]){
      months[mKey] = {
        label: d.toLocaleDateString(undefined,{month:'long',year:'numeric'}),
        total: 0,
        branches: {}
      };
    }

    if(!months[mKey].branches[branch]){
      months[mKey].branches[branch] = {
        total: 0,
        days: {}
      };
    }

    if(!months[mKey].branches[branch].days[dKey]){
      months[mKey].branches[branch].days[dKey] = {
        label: d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'}),
        total: 0,
        records: []
      };
    }

    const payment = Number(r.payment) || 0;

    months[mKey].total += payment;
    months[mKey].branches[branch].total += payment;
    months[mKey].branches[branch].days[dKey].total += payment;
    months[mKey].branches[branch].days[dKey].records.push(r);
  });

  const sortRecords = list => {
    list.sort((a,b) => {
      if(sortBy === 'amountDesc') return (Number(b.payment)||0) - (Number(a.payment)||0);
      return (a.patientName || '').localeCompare(b.patientName || '');
    });
    return list;
  };

  const renderRecord = r => `
    <div class="rec" onclick="openRecordModal('${r.id}')">
      <div>
        <div class="name">${escapeHtml(r.patientName) || '(unnamed)'}</div>
        <div class="meta">${escapeHtml(r.doctorName)} • ${escapeHtml(r.service)}</div>
      </div>
      <div class="amt">LE ${(Number(r.payment)||0).toFixed(2)}</div>
    </div>
  `;

  const renderDays = days => {
    const dayKeys = Object.keys(days).sort().reverse();

    return dayKeys.map(dKey => {
      const day = days[dKey];
      const recs = sortRecords(day.records.slice());

      return `
        <div class="ph-day">
          <span class="label">${day.label}</span>
          <span class="total mono">LE ${day.total.toFixed(2)}</span>
        </div>
        ${recs.map(renderRecord).join('')}
      `;
    }).join('');
  };

  const monthKeys = Object.keys(months).sort().reverse();

  card.innerHTML = monthKeys.map(mKey => {
    const month = months[mKey];
    const branchKeys = Object.keys(month.branches).sort(branchSort);

    return `
      <div class="ph-month">
        <span class="label">${month.label}</span>
        <span class="total mono">LE ${month.total.toFixed(2)}</span>
      </div>

      ${branchKeys.map(branch => {
        const group = month.branches[branch];

        return `
          ${branchFilter === 'all' ? `
            <div class="ph-branch-header">
              <span class="label">${escapeHtml(branch)}</span>
              <span class="total mono">LE ${group.total.toFixed(2)}</span>
            </div>
          ` : ''}

          ${renderDays(group.days)}
        `;
      }).join('')}
    `;
  }).join('');
}

function escapeHtml(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function formatDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
}

function openRecordModal(id){
  const records = loadRecords();
  const r = records.find(x=>x.id===id);
  if(!r) return;
  currentEditId = id;
  document.getElementById('f_patientName').value = r.patientName||'';
  document.getElementById('f_phone').value = r.phone||'';
  document.getElementById('f_date').value = toLocalInputValue(r.date);
  document.getElementById('f_doctorName').value = r.doctorName||'';
  document.getElementById('f_branch').value = r.branch||'';
  document.getElementById('f_category').value = r.category||'';
  document.getElementById('f_service').value = r.service||'';
  document.getElementById('f_payment').value = r.payment||0;
  document.getElementById('f_refund').value = r.refund||0;
  document.getElementById('recordModalBackdrop').classList.add('show');
}
function toLocalInputValue(iso){
  const d = new Date(iso);
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function closeRecordModal(){
  document.getElementById('recordModalBackdrop').classList.remove('show');
  currentEditId = null;
}
function saveRecordModal(){
  const records = loadRecords();
  const idx = records.findIndex(x=>x.id===currentEditId);
  if(idx===-1) return;
  records[idx] = {
    ...records[idx],
    patientName: document.getElementById('f_patientName').value,
    phone: document.getElementById('f_phone').value,
    date: new Date(document.getElementById('f_date').value).toISOString(),
    doctorName: document.getElementById('f_doctorName').value,
    branch: document.getElementById('f_branch').value,
    category: document.getElementById('f_category').value,
    service: document.getElementById('f_service').value,
    payment: parseFloat(document.getElementById('f_payment').value)||0,
    refund: parseFloat(document.getElementById('f_refund').value)||0,
  };
  saveRecords(records);
  closeRecordModal();
  renderPatients();
}
function deleteCurrentRecord(){
  if(!confirm('Delete this visit record?')) return;
  let records = loadRecords();
  records = records.filter(x=>x.id!==currentEditId);
  saveRecords(records);
  closeRecordModal();
  renderPatients();
}

/* ---------- Manual Entry ---------- */
function openManualEntryModal(){
  document.getElementById('m_patientName').value = '';
  document.getElementById('m_phone').value = '';
  document.getElementById('m_date').value = toLocalInputValue(new Date().toISOString());
  document.getElementById('m_doctorName').value = '';
  document.getElementById('m_branch').value = '';
  document.getElementById('m_category').value = '';
  document.getElementById('m_service').value = '';
  document.getElementById('m_payment').value = '';
  document.getElementById('m_refund').value = '';
  document.getElementById('manualModalBackdrop').classList.add('show');
}
function closeManualEntryModal(){
  document.getElementById('manualModalBackdrop').classList.remove('show');
}
function saveManualEntry(){
  const patientName = document.getElementById('m_patientName').value.trim();
  if(!patientName){ alert('Enter a patient name.'); return; }
  const records = loadRecords();
  records.push({
    id: uid(),
    phone: document.getElementById('m_phone').value,
    date: new Date(document.getElementById('m_date').value).toISOString(),
    branch: document.getElementById('m_branch').value,
    createdBy: '',
    patientName,
    doctorName: document.getElementById('m_doctorName').value,
    category: document.getElementById('m_category').value,
    service: document.getElementById('m_service').value,
    type: 'Cash',
    payment: parseFloat(document.getElementById('m_payment').value)||0,
    refund: parseFloat(document.getElementById('m_refund').value)||0,
  });
  saveRecords(records);
  closeManualEntryModal();
  showTab('patients');
}

/* ---------- Expenses ---------- */
function renderExpenses(){
  const expenses = loadExpenses().sort((a,b)=>new Date(b.date)-new Date(a.date));
  const card = document.getElementById('expenseListCard');
  if(expenses.length===0){
    card.innerHTML = `<div class="empty"><div class="glyph">➖</div><div>No expenses logged yet.</div></div>`;
    return;
  }
  card.innerHTML = expenses.map(e=>`
    <div class="rec">
      <div>
        <div class="name">${escapeHtml(e.title)}</div>
        <div class="meta">${escapeHtml(e.category)} • ${formatDate(e.date)}</div>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div class="amt neg">LE ${e.amount.toFixed(2)}</div>
        <button class="btn-danger" onclick="deleteExpense('${e.id}')">✕</button>
      </div>
    </div>
  `).join('');
}
function openExpenseModal(){
  document.getElementById('e_title').value='';
  document.getElementById('e_category').value='General';
  document.getElementById('e_amount').value='';
  document.getElementById('e_date').value = new Date().toISOString().slice(0,10);
  document.getElementById('e_notes').value='';
  document.getElementById('expenseModalBackdrop').classList.add('show');
}
function closeExpenseModal(){
  document.getElementById('expenseModalBackdrop').classList.remove('show');
}
function saveExpenseModal(){
  const title = document.getElementById('e_title').value.trim();
  const amount = parseFloat(document.getElementById('e_amount').value);
  if(!title || isNaN(amount)){ alert('Enter a title and amount.'); return; }
  const expenses = loadExpenses();
  expenses.push({
    id: uid(),
    title,
    category: document.getElementById('e_category').value,
    amount,
    date: new Date(document.getElementById('e_date').value).toISOString(),
    notes: document.getElementById('e_notes').value
  });
  saveExpenses(expenses);
  closeExpenseModal();
  renderExpenses();
}
function deleteExpense(id){
  if(!confirm('Delete this expense?')) return;
  saveExpenses(loadExpenses().filter(e=>e.id!==id));
  renderExpenses();
}

/* ---------- Summary ---------- */
function renderSummary(){
  const records = loadRecords();
  const expenses = loadExpenses();
  const monthKey = iso => { const d=new Date(iso); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); };
  const monthLabel = key => { const [y,m]=key.split('-'); return new Date(y,m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'}); };

  const months = {};
  records.forEach(r=>{
    const k = monthKey(r.date);
    months[k] = months[k] || {income:0, refunds:0, expenses:0};
    months[k].income += r.payment;
    months[k].refunds += r.refund;
  });
  expenses.forEach(e=>{
    const k = monthKey(e.date);
    months[k] = months[k] || {income:0, refunds:0, expenses:0};
    months[k].expenses += e.amount;
  });

  const keys = Object.keys(months).sort().reverse();
  const container = document.getElementById('summaryContent');

  if(keys.length===0){
    container.innerHTML = `<div class="card"><div class="empty"><div class="glyph">📊</div><div>No data yet. Import a report or add an expense.</div></div></div>`;
    return;
  }

  const maxNet = Math.max(...keys.map(k=>{
    const m = months[k]; return Math.abs(m.income - m.refunds - m.expenses);
  }), 1);

  container.innerHTML = keys.map(k=>{
    const m = months[k];
    const net = m.income - m.refunds - m.expenses;
    const barPct = Math.min(100, Math.abs(net)/maxNet*100);
    return `
      <div class="card month-block">
        <div class="month-title">${monthLabel(k)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${barPct}%"></div></div>
        <div class="line-row"><span>Income</span><span class="mono">LE ${m.income.toFixed(2)}</span></div>
        <div class="line-row"><span>Refunds</span><span class="mono">− LE ${m.refunds.toFixed(2)}</span></div>
        <div class="line-row"><span>Expenses</span><span class="mono">− LE ${m.expenses.toFixed(2)}</span></div>
        <div class="line-row total"><span>Net</span><span class="mono">LE ${net.toFixed(2)}</span></div>
      </div>
    `;
  }).join('');
}

/* ---------- Backup ---------- */
function exportBackup(){
  const data = { records: loadRecords(), expenses: loadExpenses(), exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'hegazy-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  URL.revokeObjectURL(url);
}
document.getElementById('importBackupInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(!confirm('This will merge the backup into your current data. Continue?')) return;
      const records = loadRecords().concat(data.records||[]);
      const expenses = loadExpenses().concat(data.expenses||[]);
      saveRecords(records);
      saveExpenses(expenses);
      alert('Backup imported.');
      renderPatients(); renderExpenses(); renderSummary();
    }catch(err){
      alert('Could not read that backup file.');
    }
  };
  reader.readAsText(file);
});

/* init */
renderPatients();
</script>
